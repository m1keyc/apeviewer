workflows:
  environment-preflight:
    name: Native build environment check
    instance_type: mac_mini_m2
    max_build_duration: 5
    scripts:
      - name: Record the Apple build environment
        script: |
          set -euo pipefail
          mkdir -p build-preflight
          {
            uname -s
            uname -m
            sw_vers -productVersion
            xcodebuild -version
            xcrun --show-sdk-path
          } | tee build-preflight/environment.txt
          printf 'No application source was fetched or built.\n' >> build-preflight/environment.txt
    artifacts:
      - build-preflight/environment.txt

  development-package:
    name: Development package
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "26.6"
      groups:
        - native-source-transfer
      vars:
        CARGO_BUILD_JOBS: 2
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    scripts:
      - name: Verify and unpack the pinned source
        script: |
          set -euo pipefail
          set +x
          test "${APE_PRIVATE_BUILD_VERIFIED:-}" = "1"
          python3 - <<'PY'
          import hashlib, os, pathlib, re, tarfile, urllib.error, urllib.parse, urllib.request
          url = os.environ.get('SOURCE_ARCHIVE_URL', '')
          digest = os.environ.get('SOURCE_ARCHIVE_SHA256', '')
          commit = os.environ.get('SOURCE_COMMIT', '')
          parsed = urllib.parse.urlsplit(url)
          if not re.fullmatch('[0-9a-f]{40}', commit) or not re.fullmatch('[0-9a-f]{64}', digest):
              raise SystemExit('Pinned source metadata is missing')
          if parsed.scheme != 'https' or parsed.hostname != 'codeload.github.com' or parsed.username or parsed.password or commit not in parsed.path:
              raise SystemExit('Unexpected source archive location')
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  content = response.read(50 * 1024 * 1024 + 1)
          except Exception:
              raise SystemExit('Source archive download failed; refresh the short-lived transfer before retrying')
          if len(content) > 50 * 1024 * 1024 or hashlib.sha256(content).hexdigest() != digest:
              raise SystemExit('Source archive integrity check failed')
          archive = pathlib.Path('source.tar.gz')
          archive.write_bytes(content)
          destination = pathlib.Path('native-source').resolve()
          if destination.exists():
              raise SystemExit('Source destination must be fresh')
          destination.mkdir()
          with tarfile.open(archive, 'r:gz') as handle:
              roots = {member.name.split('/')[0] for member in handle.getmembers()}
              if len(roots) != 1 or '' in roots or '.' in roots or '..' in roots:
                  raise SystemExit('Unexpected archive layout')
              handle.extractall(destination, filter='data')
          source = destination / next(iter(roots))
          if not source.is_dir() or not (source / 'Cargo.lock').is_file():
              raise SystemExit('Expected locked project is missing')
          pathlib.Path('source-root.txt').write_text(str(source), encoding='utf-8')
          print('Pinned source archive verified and unpacked')
          PY
      - name: Run the pinned private package recipe
        script: |
          set -euo pipefail
          set +x
          test "${APE_PRIVATE_BUILD_VERIFIED:-}" = "1"
          cd "$(cat "$CM_BUILD_DIR/source-root.txt")"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test -f tools/codemagic-macos.sh
          export APE_SOURCE_COMMIT="$SOURCE_COMMIT"
          export APE_SOURCE_ARCHIVE_SHA256="$SOURCE_ARCHIVE_SHA256"
          unset SOURCE_ARCHIVE_URL
          bash tools/codemagic-macos.sh --arch arm64 --budget-seconds 2400
    artifacts:
      - native-source/*/dist/macos-ci/**/*

  development-runtime:
    name: Development runtime environment
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: "26.6"
    scripts:
      - name: Record the runtime environment
        script: |
          set -euo pipefail
          mkdir -p runtime-preflight
          {
            uname -s
            uname -m
            sw_vers -productVersion
            xcodebuild -version
          } > runtime-preflight/environment.txt
    artifacts:
      - runtime-preflight/environment.txt
