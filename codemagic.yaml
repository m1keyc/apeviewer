workflows:
  environment-preflight:
    name: Native build environment check
    instance_type: mac_mini_m2
    max_build_duration: 5
    scripts:
      - name: Record the Apple build environment
        script: |
          set -euo pipefail
          mkdir -p build-preflight
          {
            uname -s
            uname -m
            sw_vers -productVersion
            xcodebuild -version
            xcrun --show-sdk-path
          } | tee build-preflight/environment.txt
          printf 'No application source was fetched or built.\n' >> build-preflight/environment.txt
    artifacts:
      - build-preflight/environment.txt

  development-package:
    name: Development package
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "26.6"
      groups:
        - native-source-transfer
      vars:
        CARGO_BUILD_JOBS: 2
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    cache:
      cache_paths:
        - ~/.cargo/registry
        - ~/.cargo/git
    scripts:
      - name: Verify and unpack the pinned source
        script: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import hashlib, os, pathlib, re, tarfile, urllib.error, urllib.parse, urllib.request
          url = os.environ.get('SOURCE_ARCHIVE_URL', '')
          digest = os.environ.get('SOURCE_ARCHIVE_SHA256', '')
          commit = os.environ.get('SOURCE_COMMIT', '')
          parsed = urllib.parse.urlsplit(url)
          if not re.fullmatch('[0-9a-f]{40}', commit) or not re.fullmatch('[0-9a-f]{64}', digest):
              raise SystemExit('Pinned source metadata is missing')
          if parsed.scheme != 'https' or parsed.hostname != 'codeload.github.com' or parsed.username or parsed.password or commit not in parsed.path:
              raise SystemExit('Unexpected source archive location')
          try:
              with urllib.request.urlopen(url, timeout=60) as response:
                  content = response.read(50 * 1024 * 1024 + 1)
          except Exception:
              raise SystemExit('Source archive download failed; refresh the short-lived transfer before retrying')
          if len(content) > 50 * 1024 * 1024 or hashlib.sha256(content).hexdigest() != digest:
              raise SystemExit('Source archive integrity check failed')
          archive = pathlib.Path('source.tar.gz')
          archive.write_bytes(content)
          destination = pathlib.Path('native-source').resolve()
          if destination.exists():
              raise SystemExit('Source destination must be fresh')
          destination.mkdir()
          with tarfile.open(archive, 'r:gz') as handle:
              roots = {member.name.split('/')[0] for member in handle.getmembers()}
              if len(roots) != 1 or '' in roots or '.' in roots or '..' in roots:
                  raise SystemExit('Unexpected archive layout')
              handle.extractall(destination, filter='data')
          source = destination / next(iter(roots))
          if not source.is_dir() or not (source / 'Cargo.lock').is_file():
              raise SystemExit('Expected locked project is missing')
          pathlib.Path('source-root.txt').write_text(str(source), encoding='utf-8')
          print('Pinned source archive verified and unpacked')
          PY
      - name: Check the Apple capture helper
        script: |
          set -euo pipefail
          cd "$(cat "$CM_BUILD_DIR/source-root.txt")"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          mkdir -p target/platform-evidence
          xcrun --sdk macosx swiftc -parse-as-library -swift-version 5 -target arm64-apple-macos13.0 -typecheck src/platform/desktop/capture/macos.swift 2>&1 | tee target/platform-evidence/macos-swift-check.log
      - name: Prepare Rust and codec tools
        script: |
          set -euo pipefail
          cd "$(cat "$CM_BUILD_DIR/source-root.txt")"
          brew install ffmpeg pkg-config
          if ! command -v rustup >/dev/null 2>&1; then
            brew install rustup
            export PATH="$(brew --prefix rustup)/bin:$PATH"
          fi
          rustup toolchain install 1.98.1 --profile minimal
          rustc +1.98.1 --version | tee target/platform-evidence/macos-rust-version.log
          pkg-config --modversion libavcodec libavformat libavutil libswscale | tee target/platform-evidence/macos-codec-versions.log
      - name: Check and test all targets
        script: |
          set -euo pipefail
          cd "$(cat "$CM_BUILD_DIR/source-root.txt")"
          rustup_prefix="$(brew --prefix rustup 2>/dev/null || true)"
          if [ -n "$rustup_prefix" ] && [ -d "$rustup_prefix/bin" ]; then export PATH="$rustup_prefix/bin:$PATH"; fi
          cargo +1.98.1 check --locked --all-targets 2>&1 | tee target/platform-evidence/macos-check.log
          cargo +1.98.1 test --locked --all-targets -- --test-threads=1 2>&1 | tee target/platform-evidence/macos-tests.log
      - name: Build and package development output
        script: |
          set -euo pipefail
          cd "$(cat "$CM_BUILD_DIR/source-root.txt")"
          rustup_prefix="$(brew --prefix rustup 2>/dev/null || true)"
          if [ -n "$rustup_prefix" ] && [ -d "$rustup_prefix/bin" ]; then export PATH="$rustup_prefix/bin:$PATH"; fi
          cargo +1.98.1 build --release --locked 2>&1 | tee target/platform-evidence/macos-release.log
          bash tools/package-native.sh 2>&1 | tee target/platform-evidence/macos-package.log
          target/release/APEViewer --version | tee target/platform-evidence/macos-version.log
          otool -L target/release/APEViewer > target/platform-evidence/macos-linked-libraries.log
          {
            uname -s
            uname -m
            sw_vers -productVersion
            xcodebuild -version
            printf 'Source commit: %s\n' "$SOURCE_COMMIT"
            printf 'Development output only; desktop and interoperability acceptance remains separate.\n'
          } > target/platform-evidence/macos-provenance.log
    artifacts:
      - native-source/*/dist/*development.zip
      - native-source/*/dist/*development.sha256
      - native-source/*/target/platform-evidence/macos-*.log
